<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Stream Chat Translator for Twitch - Pardi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    :root {
      --bg-color: #18181b;
      --panel-bg: #1f1f23;
      --text-main: #efeff1;
      --text-muted: #adadb8;
      --border-color: #3f3f46;
      --accent-color: #9146ff;       
      --input-bg: #2f2f35;
    }

    [data-theme="light"] {
      --bg-color: #f7f7f8;
      --panel-bg: #ffffff;
      --text-main: #0e0e10;
      --text-muted: #53535f;
      --border-color: #e4e4e7;
      --accent-color: #772ce8;       
      --input-bg: #f2f2f7;
    }

    body {
      width: 340px; 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-container {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .pardi-img-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title-group h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin: 0;
    }

    .title-group span {
      font-size: 11px;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .theme-toggle, .app-lang-select {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      font-family: inherit;
      cursor: pointer;
    }

    .theme-toggle {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 500;
    }

    .app-lang-select {
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 600;
      background-color: var(--panel-bg);
    }

    .theme-toggle:hover, .app-lang-select:hover {
      background-color: var(--input-bg);
    }

    .section-box {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-group {
      margin-bottom: 6px;
    }

    .row-switch {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

    .row-switch label {
      margin-bottom: 0;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    label {
      display: block;
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .search-lang {
      width: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12.5px;
      box-sizing: border-box;
      margin-bottom: 8px;
      outline: none;
    }

    .search-lang:focus {
      border-color: var(--accent-color);
    }

    /* Regresamos al menú desplegable nativo cerrado con flecha */
    select.lang-dropdown {
      width: 100%;
      background-color: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      box-sizing: border-box;
    }

    select.lang-dropdown:focus {
      border-color: var(--accent-color);
    }

    .switch-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border-color);
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-color);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .footer-version {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 16px;
    }

    select, .slider, .theme-toggle, .section-box {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .section-box:hover {
      border-color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-group">
      <div class="logo-container">
        <img src="Logo_extension.png" alt="Extension Logo" class="pardi-img-logo">
      </div>
      <div>
        <h1>Stream Chat Translator</h1>
        <span id="subtituloApp">by Pardi • Twitch Edition</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeBtn">Modo Claro</button>
      <select class="app-lang-select" id="appLangSelector">
        <option value="es">ES 🇪🇸</option>
        <option value="en">EN 🇬🇧</option>
      </select>
    </div>
  </div>

  <!-- SECCIÓN LEER CHAT -->
  <div class="section-box">
    <div class="section-title">
      <span id="titleIn">Traductor de Entrada</span>
      <div class="switch-container">
        <label class="switch">
          <input type="checkbox" id="chatActiva">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    
    <div class="control-group">
      <label id="labelRead" for="langLeer">Quiero leer el chat en:</label>
      <input type="text" id="searchLeer" class="search-lang" placeholder="Buscar idioma...">
      <!-- Eliminado size="4", ahora es el select nativo compacto -->
      <select id="langLeer" class="lang-dropdown">
      </select>
    </div>

    <div class="row-switch" id="contenedorManual" style="opacity: 0.5; transition: opacity 0.2s ease;">
      <label id="labelManual" for="modoManual">Traducción manual (Botón ⇄)</label>
      <label class="switch">
        <input type="checkbox" id="modoManual" disabled>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- SECCIÓN ENVIAR MENSAJES -->
  <div class="section-box">
    <div class="section-title">
      <span id="titleOut">Mis Mensajes Salientes</span>
      <div class="switch-container">
        <label class="switch">
          <input type="checkbox" id="enviarActiva">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="control-group">
      <label id="labelWrite" for="langEscribir">Quiero escribir en:</label>
      <input type="text" id="searchEscribir" class="search-lang" placeholder="Buscar idioma...">
      <!-- Eliminado size="4", ahora es el select nativo compacto -->
      <select id="langEscribir" class="lang-dropdown">
      </select>
    </div>
  </div>

  <div class="footer-version" id="footerReg">v2.1.0 • pardiesp.dev</div>

  <script src="popup.js"></script>
</body>
</html>
